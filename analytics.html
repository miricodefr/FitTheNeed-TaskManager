<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FTN - Analytics</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/shared.css" />
  <link rel="stylesheet" href="css/analytics.css" />
</head>

<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <main class="container my-5">

    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4">
      <div>
        <h1 class="mb-1">Analytics Dashboard</h1>
        <p class="text-muted mb-0">Visualize your FTN tasks (from localStorage).</p>
      </div>

      <!-- Component #3: Export CSV -->
      <button id="exportCsvBtn" class="btn btn-outline-primary">
        Export Tasks (CSV)
      </button>
    </div>

    <!-- Component #2: Insight cards -->
    <section class="row g-3 mb-4">
      <div class="col-12 col-md-3">
        <div class="card insight-card">
          <div class="card-body">
            <p class="text-muted mb-1">Total Tasks</p>
            <h2 id="insTotal" class="m-0">0</h2>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="card insight-card">
          <div class="card-body">
            <p class="text-muted mb-1">Pending</p>
            <h2 id="insPending" class="m-0 text-primary">0</h2>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="card insight-card">
          <div class="card-body">
            <p class="text-muted mb-1">Completed</p>
            <h2 id="insCompleted" class="m-0 text-success">0</h2>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-3">
        <div class="card insight-card">
          <div class="card-body">
            <p class="text-muted mb-1">Overdue (Pending)</p>
            <h2 id="insOverdue" class="m-0 text-danger">0</h2>
          </div>
        </div>
      </div>
    </section>

    <!-- Filters -->
    <section class="card mb-4">
      <div class="card-body d-flex align-items-end justify-content-between flex-wrap gap-3">
        <div>
          <h5 class="mb-1">Filters</h5>
          <p class="text-muted mb-0">Limit what appears in the charts.</p>
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <div>
            <label for="prioritySelect" class="form-label small text-muted mb-1">Priority</label>
            <select id="prioritySelect" class="form-select form-select-sm">
              <option value="all" selected>All</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>

          <div>
            <label for="statusSelect" class="form-label small text-muted mb-1">Status</label>
            <select id="statusSelect" class="form-select form-select-sm">
              <option value="all" selected>All</option>
              <option value="Pending">Pending</option>
              <option value="Completed">Completed</option>
            </select>
          </div>

          <div class="d-flex align-items-end">
            <button id="applyFiltersBtn" class="btn btn-sm btn-primary">Apply</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Component #1: Charts -->
    <section class="row g-3">
      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="mb-3">Completed vs Pending</h5>
            <canvas id="statusChart" height="140"></canvas>
            <p id="noDataMsg1" class="text-muted mt-3 mb-0 d-none">No data to display.</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="mb-3">Tasks by Priority</h5>
            <canvas id="priorityChart" height="140"></canvas>
            <p id="noDataMsg2" class="text-muted mt-3 mb-0 d-none">No data to display.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js (library) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script src="js/shared.js"></script>
<script src="js/storage.js"></script>
<script src="js/validation.js"></script>

<script src="js/analytics.js"></script>
</body>
</html>
